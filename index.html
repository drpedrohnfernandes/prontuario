<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prontuário</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prontuário">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4a5a3c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Poppins:wght@400;500;600&display=swap">
<style>
:root{
  --musgo:#4a5a3c; --musgo-esc:#3a4730; --musgo-claro:#e7ecdf;
  --bege:#f5f0e7; --bege-esc:#e9e1d2; --marrom:#7a5a43; --azul:#2f4a63; --azul-claro:#e3ebf3;
  --terracota:#b4583a; --dourado:#b48a3c;
  --texto:#27302a; --suave:#6b7268; --linha:#ddd5c6; --branco:#fffdf9;
  --raio:12px; --sombra:0 1px 2px rgba(40,40,30,.06),0 4px 14px rgba(40,40,30,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--texto);background:var(--bege);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Lora,Georgia,"Times New Roman",serif;font-weight:600;margin:0}
h1{font-style:italic;font-weight:500;color:var(--musgo)}
:root{--creme:#f3ead7}
.serif{font-family:Lora,Georgia,"Times New Roman",serif}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:44px;padding:.55em 1.05em;border-radius:10px;border:1px solid var(--linha);background:var(--branco);cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{background:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--musgo);border-color:var(--musgo);color:#fff}
.btn.pri:hover{background:var(--musgo-esc)}
.btn.azul{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.perigo{color:var(--terracota);border-color:#e6c3b6}
.btn.perigo.cheio{background:var(--terracota);color:#fff;border-color:var(--terracota)}
.btn.sm{min-height:36px;padding:.3em .75em;font-size:.92em}
.btn.link{border:0;background:none;color:var(--azul);padding:.3em .4em;min-height:36px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.grow{flex:1}

/* Bloqueio */
.lock{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--musgo) 0%,var(--musgo-esc) 100%)}
.lock .card{width:100%;max-width:420px;background:var(--branco);border-radius:18px;padding:30px 28px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.lock h1{font-size:1.9rem;color:var(--musgo)}
.lock .slogan{font-family:Lora,Georgia,serif;font-style:italic;color:var(--marrom);margin-top:.2rem}
.lock .sub{color:var(--suave);margin:.3rem 0 1.4rem}
.lock .aviso{background:var(--bege);border-radius:10px;padding:.8rem .9rem;font-size:.9rem;color:#5a4a3a;margin:.9rem 0}

/* Campos */
label.f{display:block;margin-bottom:.9rem}
label.f > span{display:block;font-size:.88rem;font-weight:600;color:#465046;margin-bottom:.3rem}
input[type=text],input[type=password],input[type=date],input[type=tel],input[type=email],input[type=number],select,textarea{width:100%;padding:.65em .75em;border:1px solid var(--linha);border-radius:10px;background:#fff;font-size:16px;min-height:44px}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid #9fb08d;outline-offset:0;border-color:#9fb08d}
.erro{color:var(--terracota);font-size:.9rem;min-height:1.2em;margin:.2rem 0 .6rem}

/* Estrutura */
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:.5rem;padding:.55rem 1rem;padding-top:max(.55rem,env(safe-area-inset-top));background:var(--musgo);color:#fff}
.topbar .marca{font-family:Lora,Georgia,serif;font-style:italic;color:var(--creme);font-size:1.15rem;font-weight:600;margin-right:auto;cursor:pointer;display:flex;align-items:center;gap:.5rem}
.topbar .marca small{font-family:-apple-system,system-ui,sans-serif;font-weight:400;opacity:.75;font-size:.78rem}
.topbar .nav{background:transparent;border:0;color:#e9eee2;padding:.45rem .7rem;border-radius:8px;cursor:pointer;min-height:40px;position:relative}
.topbar .nav.on,.topbar .nav:hover{background:rgba(255,255,255,.14);color:#fff}
.topbar .nav .ponto{position:absolute;top:6px;right:4px;width:8px;height:8px;border-radius:50%;background:#f0b35c}
.body{flex:1;display:flex;min-height:0}
.sidebar{width:310px;flex-shrink:0;border-right:1px solid var(--linha);background:var(--bege-esc);display:flex;flex-direction:column;min-height:0}
.sidebar .busca{padding:.8rem;border-bottom:1px solid var(--linha);display:flex;flex-direction:column;gap:.55rem}
.plist{overflow:auto;flex:1;padding:.4rem}
.abas-lista{display:flex;gap:.35rem;padding:.6rem .75rem .35rem}
.apoio{border:1px solid var(--linha,#d9cfbd);border-radius:12px;background:#faf6ee;margin:0 0 1.2rem;overflow:hidden}
.apoio-topo{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;padding:.55rem .6rem;border-bottom:1px solid var(--linha,#d9cfbd);background:#f3ead9}
.apoio-topo .aba{border:1px solid var(--linha,#d9cfbd);background:#fffdf8;border-radius:999px;padding:.4rem .8rem;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--texto,#2b2b2b);min-height:36px}
.apoio-topo .aba.on{background:var(--musgo,#4a5a3c);border-color:var(--musgo,#4a5a3c);color:#fff}
.apoio-topo .ocultar{margin-left:auto}
.apoio-p{display:none;padding:.8rem 1rem;max-height:24rem;overflow:auto}
.apoio-p.on{display:block}
.apoio.fechado .apoio-p{display:none}
.apoio .ap-data{font-size:.85rem;color:var(--suave);margin-bottom:.4rem}
.apoio .ap-txt{white-space:pre-wrap;line-height:1.5}
.apoio details{border-bottom:1px dashed var(--linha,#d9cfbd);padding:.45rem 0}
.apoio details summary{cursor:pointer;font-weight:600}
.apoio details summary small{font-weight:400;color:var(--suave)}
.apoio .vazio{color:var(--suave);font-size:.92rem}
.abas-lista:empty{display:none}
.abas-lista .aba{flex:1;border:1px solid var(--linha,#d9cfbd);background:transparent;border-radius:999px;padding:.45rem .6rem;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--texto,#2b2b2b);min-height:38px}
.abas-lista .aba.on{background:var(--musgo,#4a5a3c);border-color:var(--musgo,#4a5a3c);color:#fff}
.plist-cab{font-size:.78rem;color:var(--suave);text-transform:uppercase;letter-spacing:.04em;padding:.2rem .75rem .45rem}
.pitem{display:block;width:100%;text-align:left;border:0;background:transparent;padding:.7rem .75rem;border-radius:10px;cursor:pointer;margin-bottom:2px}
.pitem:hover{background:rgba(255,255,255,.55)}
.pitem.on{background:var(--branco);box-shadow:var(--sombra)}
.pitem b{display:block;font-weight:600}
.pitem small{color:var(--suave)}
.main{flex:1;overflow:auto;padding:1.4rem 1.6rem 3rem;min-width:0}
.voltar{display:none}
.vazio{color:var(--suave);text-align:center;padding:2.5rem 1rem}

.card{background:var(--branco);border-radius:var(--raio);box-shadow:var(--sombra);padding:1.1rem 1.25rem;margin-bottom:1rem}
.card h2{font-size:1.15rem;margin-bottom:.7rem}
.card h3{font-size:1rem;margin-bottom:.5rem}
.banner{border-radius:var(--raio);padding:.85rem 1rem;margin-bottom:1rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.banner.alerta{background:#fbecd9;color:#6b4a1f;border:1px solid #f0d3ac}
.banner.info{background:var(--azul-claro);color:var(--azul);border:1px solid #c9d7e6}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;margin-bottom:1rem}
.kpi{background:var(--branco);border-radius:var(--raio);box-shadow:var(--sombra);padding:1rem 1.1rem}
.kpi .n{font-family:Georgia,serif;font-size:1.9rem;color:var(--musgo);line-height:1.1}
.kpi .l{color:var(--suave);font-size:.88rem}

.phead{display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--musgo-claro);color:var(--musgo);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:1.35rem;font-weight:600;flex-shrink:0}
.phead h1{font-size:1.5rem}
.meta{color:var(--suave);font-size:.92rem;display:flex;flex-wrap:wrap;gap:.25rem 1rem;margin-top:.25rem}
.tag{display:inline-block;padding:.12em .6em;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--musgo-claro);color:var(--musgo)}
.tag.azul{background:var(--azul-claro);color:var(--azul)}
.tag.marrom{background:#efe4da;color:var(--marrom)}
.tag.pend{background:#fbecd9;color:#8a5a1c}
.tag.ok{background:#e1efe0;color:#2f6b35}
.tag.ruim{background:#f7dcd3;color:var(--terracota)}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:1rem;align-items:start}
.med{display:flex;justify-content:space-between;gap:.5rem;padding:.55rem 0;border-bottom:1px dashed var(--linha)}
.med:last-child{border-bottom:0}
.med small{color:var(--suave);display:block}

.reg{border-left:4px solid var(--musgo);padding-left:1rem}
.reg.evolucao{border-left-color:var(--azul)}
.reg.adendo{border-left-color:var(--dourado)}
.hist-meds{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.4rem;margin:.2rem 0 1rem;max-height:320px;overflow:auto}
.hist-med{text-align:left;border:1px solid var(--linha,#d9cfbd);background:#fff;border-radius:10px;padding:.5rem .65rem;cursor:pointer;font-size:.9rem;line-height:1.3}
.hist-med:hover{border-color:var(--musgo,#4a5a3c);background:var(--musgo-claro,#e3e8d9)}
.hist-med small{display:block;color:var(--suave);font-size:.76rem;margin-top:.15rem}
.hist-det{margin-bottom:.7rem}
.hist-det summary{cursor:pointer;color:var(--azul,#2f4a63);font-weight:600;padding:.3rem 0}
.hist-det .hist-meds{max-height:220px;margin-top:.4rem}
.passos-ass{padding-left:1.2rem;margin:.4rem 0 .8rem}
.aviso-edit{background:#f3ead9;border:1px solid #d9c29a;color:#5a4326;font-size:.92rem}
.versoes{margin-top:.8rem;border-top:1px dashed var(--linha,#d9cfbd);padding-top:.5rem}
.versoes summary{cursor:pointer;color:var(--suave);font-size:.9rem}
.versao{margin:.6rem 0;padding:.5rem .7rem;background:#faf6ee;border-radius:8px;opacity:.85}
.versao .vt{font-size:.82rem;color:var(--suave);margin-bottom:.3rem}
.passos-ass li{margin-bottom:.8rem;line-height:1.45}
.card.anulado{opacity:.62}
.card.anulado .rtit{text-decoration:line-through}
.aviso-anul{background:#f8e6e1;border:1px solid #e3b9ad;color:#7a2e1e;border-radius:10px;padding:.6rem .8rem;margin:.6rem 0}
.btn.link.perigo-txt{color:#a3442f}
.reg.cfm{border-left-color:var(--marrom)}
.reg.receita{border-left-color:var(--terracota)}
.reg.doctoralia{border-left-color:#6b5aa8}
.reg.documento{border-left-color:var(--azul)}
.reg.escala{border-left-color:var(--dourado,#b08d3c)}
.reg.litemia{border-left-color:var(--marrom,#7a5a43)}
.esc-item{padding:.7rem .9rem}
.esc-q{font-weight:600;margin-bottom:.45rem}
.esc-ops{display:flex;flex-wrap:wrap;gap:.4rem}
.esc-op{position:relative;display:flex;align-items:center;gap:.45rem;border:1px solid var(--linha,#d9cfbd);border-radius:10px;padding:.45rem .7rem;cursor:pointer;background:#fff;font-size:.92rem;min-height:44px}
.esc-op input{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.esc-item:last-of-type{margin-bottom:1rem}
.esc-op .v{display:inline-flex;align-items:center;justify-content:center;min-width:1.6rem;height:1.6rem;border-radius:50%;background:var(--bege,#efe7d8);font-weight:600;font-size:.85rem}
.esc-op.on{border-color:var(--musgo,#4a5a3c);background:var(--musgo-claro,#e3e8d9)}
.esc-op.on .v{background:var(--musgo,#4a5a3c);color:#fff}
.esc-barra{position:sticky;bottom:0}
.esc-res{border-top:1px solid var(--linha,#e6dccb);padding:.55rem 0 .2rem}
.esc-res small{color:var(--suave)}
.lit-ex{display:flex;justify-content:space-between;gap:.6rem;padding:.25rem 0;border-top:1px dashed var(--linha,#e6dccb);font-size:.9rem}
.lit-ex small{color:var(--suave)}
.ret-item{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.45rem 0;border-top:1px dashed var(--linha,#e6dccb)}
.ret-item small{font-size:.82rem}
.bg-trecho{font-size:.88rem;color:#454d45;margin-top:.15rem;white-space:pre-wrap;word-break:break-word}
.bg-trecho mark,#bg-res mark{background:#f3e3b5;padding:0 .1em;border-radius:3px}
.mon-int{display:block;min-height:1.2em;margin-top:.2rem}
.mon-sec summary{cursor:pointer;padding:.9rem 0 .6rem;list-style:none}
.mon-sec summary::-webkit-details-marker{display:none}
.mon-sec summary h3::before{content:'▸ ';color:var(--suave)}
.mon-sec[open] summary h3::before{content:'▾ '}
.reg.monitor{border-left-color:#5b7f8f}
.modal.largo{max-width:900px}
.resumo-tela{max-height:66vh;overflow:auto;border:1px solid #e6dccb;border-radius:10px;padding:1rem 1.2rem;background:#fff;font-size:.9rem;margin-bottom:.8rem}
.resumo .p-cab h1{font-size:1.05rem;margin:0}
.resumo .p-cab{border-bottom:2px solid #4a5a3c;padding-bottom:6px;margin-bottom:10px;font-size:.85em}
.resumo .res-sub{font-size:.8em;color:#777;margin-bottom:8px}
.resumo .res-id{background:#f5f0e7;border-radius:6px;padding:6px 10px;margin-bottom:8px;line-height:1.45}
.resumo .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.resumo .res-sec h4{font-size:.78em;text-transform:uppercase;letter-spacing:.04em;color:#4a5a3c;margin:8px 0 3px;border-bottom:1px solid #e6dccb;padding-bottom:2px}
.resumo .res-sec ul{margin:0;padding-left:16px}.resumo .res-sec li{margin:1px 0}
.resumo .res-sec p{margin:0}
.resumo .res-d{color:#7a7a7a;font-size:.88em}
.resumo .p-rod{margin-top:12px;border-top:1px solid #ccc;padding-top:5px;font-size:.75em;color:#555}
@media (max-width:700px){.resumo .res-grid{grid-template-columns:1fr}}
.sugs{display:flex;flex-wrap:wrap;gap:.35rem;margin:-.4rem 0 .9rem}
.sug{border:1px solid var(--linha);background:#fff;border-radius:99px;padding:.25em .7em;font-size:.82rem;cursor:pointer;color:#465046;min-height:30px}
.sug:hover{background:var(--musgo-claro)}
.sug.atalho{border-color:var(--dourado,#b08d3c);font-weight:600}
.item-rx{border:1px solid var(--linha);border-radius:10px;padding:.7rem .8rem .1rem;margin-bottom:.7rem;background:#fff}
.alerta-rx{background:#fbecd9;border:1px solid #f0d3ac;color:#6b4a1f;border-radius:10px;padding:.6rem .8rem;margin:.2rem 0 .8rem;font-size:.92rem}
.reg .rtop{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;align-items:center;cursor:pointer}
.reg .rtit{font-weight:600}
.reg .rmeta{color:var(--suave);font-size:.86rem}
.reg .resumo{color:#4a524a;margin-top:.35rem;font-size:.95rem}
.campo{margin:.6rem 0}
.campo .k{font-size:.8rem;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.03em}
.campo .v{white-space:pre-wrap}
.secao-t{font-family:Georgia,serif;color:var(--marrom);font-weight:600;margin:1rem 0 .2rem;font-size:1.02rem}
.adendos{margin-top:.8rem;padding:.7rem .9rem;background:#faf5ea;border-radius:10px}
.hash{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;color:var(--suave);word-break:break-all}

.form-sec{background:var(--branco);border-radius:var(--raio);box-shadow:var(--sombra);padding:1rem 1.2rem .3rem;margin-bottom:1rem}
.form-sec h3{font-size:1.05rem;color:var(--marrom);margin-bottom:.8rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 1rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.5rem}
.chip{background:var(--azul-claro);color:var(--azul);border-radius:99px;padding:.3em .4em .3em .8em;display:inline-flex;gap:.3rem;align-items:center;font-size:.92rem}
.chip button{border:0;background:rgba(47,74,99,.12);color:var(--azul);border-radius:50%;width:24px;height:24px;cursor:pointer;line-height:1}
.barra-acoes{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bege) 30%);padding:1rem 0 .4rem;display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap}
.salvo{color:var(--suave);font-size:.85rem;margin-right:auto;align-self:center}

table.aud{width:100%;border-collapse:collapse;font-size:.92rem}
table.aud th,table.aud td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--linha);vertical-align:top}
table.aud th{color:var(--suave);font-weight:600;font-size:.82rem}

/* Modal e aviso */
.modal-fundo{position:fixed;inset:0;background:rgba(30,35,28,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal{background:var(--branco);border-radius:16px;max-width:520px;width:100%;padding:1.3rem 1.4rem;box-shadow:0 18px 50px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal h2{font-size:1.25rem;margin-bottom:.6rem}
.modal p{margin:.4rem 0 1rem;color:#454d45}
.modal .acoes{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1rem}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#2b332a;color:#fff;padding:.75rem 1.1rem;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#print-root{display:none}
.lme-tab{display:grid;gap:.5rem}
.lme-lin{display:grid;grid-template-columns:1.6rem minmax(12rem,1.4fr) 2fr;gap:.4rem;align-items:center}
.lme-n{font-weight:700;color:var(--musgo,#4a5a3c);text-align:center}
.lme-qs{display:grid;grid-template-columns:repeat(6,1fr) auto;gap:.3rem;align-items:center}
.lme-qs input{padding:.55em .35em;text-align:center}
@media (max-width:900px){.lme-lin{grid-template-columns:1.6rem 1fr}.lme-qs{grid-column:2}}
.op-r{display:inline-flex;gap:.35rem;align-items:center;margin-right:1rem;cursor:pointer}
.op-r input{width:20px;height:20px;min-height:0;margin:0}
.rot-f{display:block;font-size:.88rem;font-weight:600;color:#465046;margin-bottom:.35rem}

/* Tela estreita (iPad em pé, celular) */
@media (max-width:900px){
  .sidebar{width:100%;border-right:0}
  .shell.detalhe .sidebar{display:none}
  .shell:not(.detalhe) .main{display:none}
  .voltar{display:inline-flex;margin-bottom:.8rem}
  .cols{grid-template-columns:1fr}
  .main{padding:1rem 1rem 3rem}
  .topbar .nav .txt{display:none}
}
@media (max-width:600px){ .grid2,.grid3{grid-template-columns:1fr} .topbar .marca small{display:none} }

/* Guia visual dos remédios (tela e impressão) */
.reg.guia{border-left-color:#b4583a}
.gv{font-family:Poppins,Arial,sans-serif;color:#1f2620;background:#fff;box-sizing:border-box;display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:calc(10pt * var(--gk,1));line-height:1.3;text-align:left}
.gv *{box-sizing:border-box}
.gv svg{display:block;flex:none}
.gv-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:6mm;padding-bottom:3mm;border-bottom:2pt solid #4a5a3c;position:relative;margin-bottom:5mm}

function b64(buf) { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s) { const bin = atob(s); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b; }

/* ---------- criptografia ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
async function derivarChave(senha, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(senha), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ITERACOES, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function cifrar(chave, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, chave, enc.encode(JSON.stringify(obj)));
  return {iv: b64(iv), ct: b64(ct)};
}
async function decifrar(chave, pacote) {
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: unb64(pacote.iv)}, chave, unb64(pacote.ct));
  return JSON.parse(dec.decode(pt));
}
function canonico(v) {
  if (Array.isArray(v)) return '[' + v.map(canonico).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canonico(v[k])).join(',') + '}';
  return JSON.stringify(v);
}
async function sha256(txt) { const h = await crypto.subtle.digest('SHA-256', enc.encode(txt)); return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2,'0')).join(''); }
const conteudoRegistro = r => { const c = {id:r.id, patientId:r.patientId, tipo:r.tipo, data:r.data, criadoEm:r.criadoEm, campos:r.campos, cid:r.cid, refId:r.refId || null, autor:r.autor}; if (r.versoes && r.versoes.length) { c.versoes = r.versoes.map(v => v.hash); c.editadoEm = r.editadoEm; } return c; };
async function hashRegistro(r) { return sha256(canonico(conteudoRegistro(r))); }

/* ---------- armazenamento local (IndexedDB) ---------- */
const Memoria = {};
const Store = {
  db: null, volatil: false,
  abrir() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('prontuario', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) {
    try { const db = await this.abrir(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
    catch (e) { this.volatil = true; return Memoria[k]; }
  },
  async set(k, v) {
    try { const db = await this.abrir(); await new Promise((res, rej) => { const t = db.transaction('kv','readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
    catch (e) { this.volatil = true; Memoria[k] = v; }
  },
  async del(k) {
    try { const db = await this.abrir(); await new Promise((res, rej) => { const t = db.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
    catch (e) { delete Memoria[k]; }
  }
};

let toastT;
function aviso(msg, ms = 3200) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms); }
function modal(html, aoAbrir) {
  const raiz = $('#modal-root');
  raiz.innerHTML = `<div class="modal-fundo"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const fechar = () => { raiz.innerHTML = ''; };
  raiz.querySelector('.modal-fundo').addEventListener('click', e => { if (e.target.classList.contains('modal-fundo')) fechar(); });
  if (aoAbrir) aoAbrir(raiz.querySelector('.modal'), fechar);
  const f = raiz.querySelector('input,textarea,select'); if (f && !ehToque) f.focus();
  return fechar;
}

      const ok = () => { const v = m.querySelector('#m-senha').value; fechar(); res(v || null); };
      m.querySelector('[data-m=nao]').onclick = () => { fechar(); res(null); };
      m.querySelector('[data-m=sim]').onclick = ok;

}

/* ============================================================

   ============================================================ */
async function telaBloqueio() {
  const cofre = await Store.get('cofre');
  S.temCofre = !!cofre;
  const app = $('#app');
  if (!cofre) {
    app.innerHTML = `<div class="lock"><form class="card" id="f-criar" autocomplete="off">
      <h1>Prontuário</h1><div class="slogan">Saúde mental, seu cuidado principal!</div><div class="sub">Primeiro acesso neste aparelho</div>
      <label class="f"><span>Crie uma senha (mínimo 8 caracteres)</span><input type="password" id="s1" autocomplete="new-password"></label>
      <label class="f"><span>Repita a senha</span><input type="password" id="s2" autocomplete="new-password"></label>
      <div class="aviso"><b>Guarde bem esta senha.</b> Ela protege os dados dos pacientes e não pode ser recuperada: sem ela, nem os backups abrem.<br><br>Já usa o prontuário em outro aparelho? Crie aqui a <b>mesma senha</b> e depois importe o backup.</div>
      <div class="erro" id="erro"></div>
      <button class="btn pri" style="width:100%">Criar e entrar</button>
    </form></div>`;
    $('#f-criar').addEventListener('submit', async e => {
      e.preventDefault();
      const a = $('#s1').value, b = $('#s2').value;
      if (a.length < 8) return $('#erro').textContent = 'A senha precisa ter pelo menos 8 caracteres.';
      if (a !== b) return $('#erro').textContent = 'As senhas não conferem.';
      $('#erro').textContent = 'Preparando…';
      const salt = crypto.getRandomValues(new Uint8Array(16));
      S.saltB64 = b64(salt); S.chave = await derivarChave(a, salt); S.senha = a;
      S.dados = DADOS_VAZIOS(); auditar('Cofre criado neste aparelho');
      await salvar(); aposEntrar();
    });
  } else {
    app.innerHTML = `<div class="lock"><form class="card" id="f-entrar">
      <h1>Prontuário</h1><div class="slogan">Saúde mental, seu cuidado principal!</div><div class="sub">Digite sua senha para abrir</div>
      <label class="f"><span>Senha</span><input type="password" id="s1" autocomplete="current-password"></label>
      <div class="erro" id="erro"></div>
      <button class="btn pri" style="width:100%">Entrar</button>
    </form></div>`;
    $('#f-entrar').addEventListener('submit', async e => {
      e.preventDefault();
      const senha = $('#s1').value; if (!senha) return;
      $('#erro').textContent = 'Abrindo…';
      try {
        const chave = await derivarChave(senha, unb64(cofre.salt));
        const dados = await decifrar(chave, cofre);
        S.chave = chave; S.senha = senha; S.saltB64 = cofre.salt; S.dados = Object.assign(DADOS_VAZIOS(), dados); ajustarQtdMeds();
        S.dados.settings = Object.assign(DADOS_VAZIOS().settings, dados.settings || {});
        if (!S.dados.settings.googleClientId) S.dados.settings.googleClientId = GOOGLE_CLIENT_ID_PADRAO;
        auditar('Acesso ao prontuário'); await salvar(); aposEntrar();
      } catch (err) { $('#erro').textContent = 'Senha incorreta.'; $('#s1').value = ''; }
    });
  }
  if (!ehToque) setTimeout(() => $('#s1') && $('#s1').focus(), 50);
}
function aposEntrar() {
  S.ultimaAtividade = Date.now(); S.view = {nome:'inicio'};
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  render();
  if (Store.volatil) aviso('Atenção: este navegador não permite guardar dados. Nada será salvo ao fechar.', 7000);
}
function bloquear(motivo) {
  S.chave = null; S.senha = null; S.dados = null; S.rascunho = null; S.abertos.clear();
  $('#modal-root').innerHTML = '';
  telaBloqueio();
  if (motivo) setTimeout(() => aviso(motivo), 100);
}
setInterval(() => {
  if (!S.chave) return;
  const min = Number(S.dados.settings.bloqueioMin) || 10;
  if (Date.now() - S.ultimaAtividade > min * 60000) bloquear('Bloqueado por inatividade.');
}, 20000);
['pointerdown','keydown','scroll','touchstart'].forEach(ev => document.addEventListener(ev, () => { S.ultimaAtividade = Date.now(); }, {passive:true, capture:true}));

function precisaBackup() {
  if (!S.dados.patients.length) return false;
  const u = S.dados.settings.ultimoBackup;
  if (!u) return true;
  const ultimaMudanca = Math.max(0, ...S.dados.records.map(r => Date.parse(r.criadoEm)), ...S.dados.patients.map(p => Date.parse(p.atualizadoEm || p.criadoEm)));
  return ultimaMudanca > Date.parse(u.em) && (Date.now() - Date.parse(u.em) > 24 * 3600e3);
}
function render() {
  if (!S.chave) return telaBloqueio();
  const v = S.view.nome;
  const detalhe = v !== 'inicio' || false;
  const nav = (n, rot, ic, extra = '') => `<button class="nav ${v === n ? 'on' : ''}" data-act="ir" data-v="${n}" title="${rot}">${ic} <span class="txt">${rot}</span>${extra}</button>`;
  $('#app').innerHTML = `<div class="shell ${detalhe ? 'detalhe' : ''}">
    <header class="topbar">
      <div class="marca" data-act="ir" data-v="inicio">Prontuário <small>${esc(S.dados.settings.medico)}</small></div>

      ${nav('backup','Backup','⇅', precisaBackup() ? '<span class="ponto"></span>' : '')}
      ${nav('auditoria','Registro de acesso','☰')}
      ${nav('config','Ajustes','⚙')}

    </header>

        <div class="busca">
          <input type="text" id="busca" placeholder="Buscar paciente…" value="${esc(S.busca)}" autocomplete="off">
          <button class="btn pri" data-act="novo-paciente">+ Novo paciente</button>
        </div>
        <div class="abas-lista" id="abas-lista">${abasLista()}</div>
        <div class="plist" id="plist">${listaPacientes()}</div>
      </aside>
      <main class="main" id="main">${telaPrincipal()}</main>
    </div></div>`;
  const b = $('#busca');
  b.addEventListener('input', () => { S.busca = b.value; $('#plist').innerHTML = listaPacientes(); $('#abas-lista').innerHTML = abasLista(); });
  if (v === 'registro') ligarFormRegistro();

  if (v === 'escala') ligarEscala();
  if (v === 'lme') ligarLME();
  if (v === 'litemia') ligarLitemia();
  if (v === 'monitor') ligarMonitor();
  if (v === 'busca-geral') ligarBuscaGeral();
  if (v === 'guia') ligarGuia();
  if (v === 'backup' && S.dados.settings.googleClientId) Drive.carregarGIS().catch(() => {});
  $('#main').scrollTop = 0;
}
const TIPOS_AUX = ['adendo', 'anulacao'];
const anulacaoDe = id => S.dados.records.find(a => a.tipo === 'anulacao' && a.refId === id);
const anulado = r => !!anulacaoDe(r.id);
const N_RECENTES = 20;
function ultimoAtendimento(pid) {
  const hoje = hojeStr();
  let ult = null;
  for (const r of S.dados.records) if (r.patientId === pid && !TIPOS_AUX.includes(r.tipo) && r.data && r.data <= hoje && !anulado(r) && (!ult || r.data > ult.data || (r.data === ult.data && (r.criadoEm || '') > (ult.criadoEm || '')))) ult = r;
  return ult;
}
function pacientesRecentes() {
  return S.dados.patients.filter(p => !p.arquivado).map(p => ({p, ult: ultimoAtendimento(p.id)})).filter(x => x.ult)
    .sort((a, b) => (b.ult.data + (b.ult.criadoEm || '')).localeCompare(a.ult.data + (a.ult.criadoEm || ''))).slice(0, N_RECENTES).map(x => x.p);
}
function abasLista() {
  if (S.busca.trim()) return '';
  const aba = S.abaLista || 'recentes', total = S.dados.patients.filter(p => !p.arquivado).length;
  return `<button class="aba ${aba === 'recentes' ? 'on' : ''}" data-act="aba-lista" data-aba="recentes">Recentes</button><button class="aba ${aba === 'todos' ? 'on' : ''}" data-act="aba-lista" data-aba="todos">Todos (${total})</button>`;
}
function listaPacientes() {
  const q = semAcento(S.busca.trim());
  const recentes = !q && (S.abaLista || 'recentes') === 'recentes';
  let ps = S.dados.patients.filter(p => !p.arquivado);
  if (q) ps = ps.filter(p => semAcento(p.nome).includes(q) || (p.cpf || '').replace(/\D/g,'').includes(q.replace(/\D/g,'') || '###') || semAcento(p.telefone).includes(q));
  if (recentes) ps = pacientesRecentes();
  else ps.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  if (!ps.length) return `<div class="vazio">${!S.dados.patients.length ? 'Nenhum paciente ainda.<br>Toque em “+ Novo paciente”.' : recentes ? 'Nenhum atendimento registrado ainda.' : 'Nenhum paciente encontrado.'}</div>`;
  const atual = S.view.pid;
  const cab = recentes ? `<div class="plist-cab">Últimos ${ps.length} pacientes atendidos</div>` : q ? `<div class="plist-cab">${ps.length} encontrado(s) entre todos os pacientes</div>` : '';
  return cab + ps.map(p => {
    const ult = ultimoAtendimento(p.id);
    return `<button class="pitem ${p.id === atual ? 'on' : ''}" data-act="abrir-paciente" data-id="${p.id}"><b>${esc(p.nome)}</b><small>${p.nascimento ? esc(idade(p.nascimento)) + ' · ' : ''}${ult ? 'Último atendimento ' + fmtData(ult.data) : 'Sem atendimentos'}</small></button>`;
  }).join('');
}

function camposHTML(r, ficha) {
  let h = '';
  for (const sec of ficha.secoes) {
    const linhas = sec.campos.filter(([k]) => k === 'cid' ? (r.cid || []).length : (r.campos[k] || '').trim());
    if (!linhas.length) continue;
    if (ficha.secoes.length > 1) h += `<div class="secao-t">${esc(sec.t)}</div>`;
    for (const [k, rot] of linhas) {
      const val = k === 'cid' ? r.cid.join('; ') : r.campos[k];

}
function pedirMotivo(titulo, texto) {
  return new Promise(res => {
    modal(`<h2>${esc(titulo)}</h2><p>${texto}</p><label class="f"><span>Motivo (obrigatório)</span><textarea id="m-motivo" rows="3" placeholder="ex.: exame solicitado por engano; documento gerado para o paciente errado"></textarea></label><div class="acoes"><button class="btn" data-m="nao">Cancelar</button><button class="btn perigo cheio" data-m="sim">Anular registro</button></div>`, (m, fechar) => {
      const campo = m.querySelector('#m-motivo'); setTimeout(() => campo.focus(), 50);
      m.querySelector('[data-m=nao]').onclick = () => { fechar(); res(null); };
      m.querySelector('[data-m=sim]').onclick = () => { const v = campo.value.trim(); if (v.length < 4) { campo.style.borderColor = '#a3442f'; campo.focus(); return; } fechar(); res(v); };
    });
  });
}
async function anularRegistro(id) {
  const r = S.dados.records.find(x => x.id === id); if (!r || anulado(r)) return;
  const p = paciente(r.patientId), s = S.dados.settings;
  const desc = `${r.tipo === 'escala' ? 'Escala ' + String(r.campos.nome || '').split(' – ')[0] : nomeTipo(r.tipo)}${r.campos.titulo ? ' – ' + r.campos.titulo : ''} de ${fmtData(r.data)}`;
  const motivo = await pedirMotivo('Anular registro?', `<b>${esc(desc)}</b><br><br>Pelas normas do CFM o prontuário não pode ter registros apagados. O registro anulado <b>sai da tela do prontuário</b>, mas fica guardado no sistema, sem validade, com a data, a hora e o motivo (pode ser consultado pelo link discreto no fim da lista). A anulação não pode ser desfeita.`);
  if (!motivo) return;
  const reg = {id: uid(), patientId: r.patientId, tipo: 'anulacao', data: hojeStr(), criadoEm: agoraISO(), campos: {registro: desc, motivo}, cid: [], refId: r.id, autor: `${s.medico} – ${s.crm}`, assinatura: {status: 'pendente'}};
  reg.hash = await hashRegistro(reg);
  S.dados.records.push(reg);
  auditar('Registro anulado', `${desc} – ${p.nome} – motivo: ${motivo}`, p.id);
  await salvar();
  S.abertos.delete(r.id);
  abrirPaciente(p.id);

async function salvarPaciente(form) {
  const fd = Object.fromEntries(new FormData(form).entries());
  for (const k in fd) fd[k] = fd[k].trim();
  if (!fd.nome) return aviso('Informe o nome do paciente.');
  if (S.view.pid) {
    const p = paciente(S.view.pid);
    const mudou = Object.keys(fd).filter(k => (p[k] || '') !== fd[k]);
    Object.assign(p, fd, {atualizadoEm: agoraISO()});
    auditar('Dados do paciente alterados', mudou.join(', ') || 'sem mudanças', p.id);
    await salvar(); abrirPaciente(p.id); aviso('Dados salvos.');
  } else {
    const p = Object.assign({id: uid(), criadoEm: agoraISO(), atualizadoEm: agoraISO(), medicacoes: []}, fd);
    S.dados.patients.push(p); auditar('Paciente cadastrado', p.nome, p.id);
    await salvar(); abrirPaciente(p.id); aviso('Paciente cadastrado.');
  }
}

function chaveRascunho(tipo, pid, ref) { return [tipo, pid, ref || ''].join('|'); }
const ordDesc = (a, b) => (b.data || '').localeCompare(a.data || '') || (b.criadoEm || '').localeCompare(a.criadoEm || '');
function painelApoio(r) {
  if (r.tipo !== 'evolucao') return '';
  const p = paciente(r.patientId);
  const editado = r.editId ? S.dados.records.find(x => x.id === r.editId) : null;
  const antes = x => !editado || x.data < editado.data || (x.data === editado.data && x.criadoEm < editado.criadoEm);
  const vis = S.dados.records.filter(x => x.patientId === r.patientId && !TIPOS_AUX.includes(x.tipo) && !anulado(x) && x.id !== r.editId && antes(x));
  const evols = vis.filter(x => x.tipo === 'evolucao' || x.tipo === 'doctoralia').sort(ordDesc);

    : '<div class="vazio">Esta é a primeira evolução deste paciente.</div>';

      ${primeira.campos.hipotese || (primeira.cid || []).length ? `<div class="campo"><div class="k">Hipótese diagnóstica</div><div class="v">${esc([primeira.campos.hipotese, (primeira.cid || []).join('; ')].filter(Boolean).join(' · '))}</div></div>` : ''}
      <details style="border:0"><summary style="font-weight:400;color:var(--musgo)">Ver a primeira consulta completa</summary><div style="margin-top:.4rem">${camposHTML(primeira, FICHAS.primeira)}</div></details>`
    : '<div class="vazio">Nenhuma primeira consulta registrada para este paciente.</div>';

    : `<div class="vazio">Os antecedentes não foram preenchidos na primeira consulta de ${fmtData(primeira.data)}.</div>`;
  const tabs = [['conduta', 'Última conduta'], ['evol', `Evoluções anteriores (${evols.length})`], ['hma', 'HMA da 1ª consulta'], ['ant', 'Antecedentes médicos']];

function chipsCID() { return (S.rascunho.cid || []).map((c, i) => `<span class="chip">${esc(c)}<button type="button" data-act="tirar-cid" data-i="${i}" aria-label="Remover">×</button></span>`).join(''); }
let rascunhoT;
function guardarRascunho() {
  $('#salvo') && ($('#salvo').textContent = 'Salvando…');
  clearTimeout(rascunhoT);
  rascunhoT = setTimeout(async () => {
    if (!S.rascunho || !S.chave) return;
    S.dados.drafts[S.rascunho.chave] = S.rascunho;
    await salvar();
    $('#salvo') && ($('#salvo').textContent = 'Rascunho salvo ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  }, 700);
}
function ligarFormRegistro() {
  const f = $('#f-registro');
  f.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.c) { S.rascunho.campos[el.dataset.c] = el.value; guardarRascunho(); }
    else if (el.id === 'r-data') { S.rascunho.data = el.value; guardarRascunho(); }
  });
  const ci = $('#cid-input');
  if (ci) {
    const add = () => {
      const val = ci.value.trim(); if (!val) return;
      if (!S.rascunho.cid.includes(val)) S.rascunho.cid.push(val);
      ci.value = ''; $('#cid-chips').innerHTML = chipsCID(); guardarRascunho();
    };
    ci.addEventListener('change', add);
    ci.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
  }
  f.addEventListener('submit', e => { e.preventDefault(); finalizarRegistro(); });
}
function abrirRegistro(tipo, pid, ref) {
  const chave = chaveRascunho(tipo, pid, ref);
  S.rascunho = S.dados.drafts[chave] || {chave, tipo, patientId: pid, refId: ref || null, data: hojeStr(), campos: {}, cid: []};
  S.view = {nome:'registro', pid};
  render();
  if (S.dados.drafts[chave]) aviso('Rascunho anterior recuperado.');
}
async function finalizarRegistro() {
  const r = S.rascunho;
  const ci = $('#cid-input'); if (ci && ci.value.trim()) { r.cid.push(ci.value.trim()); ci.value = ''; }
  const campos = {}; for (const k in r.campos) if ((r.campos[k] || '').trim()) campos[k] = r.campos[k].trim();
  if (!Object.keys(campos).length) return aviso('Preencha ao menos um campo antes de finalizar.');
  if (r.tipo !== 'adendo' && !r.data) return aviso('Informe a data do atendimento.');
  const ok = await confirmar(r.tipo === 'adendo' ? {titulo:'Finalizar adendo?', texto:'O adendo entra no prontuário com data e hora e <b>não pode ser alterado</b> depois.', ok:'Finalizar'}

  if (!ok) return;
  const s = S.dados.settings;
  const reg = {id: uid(), patientId: r.patientId, tipo: r.tipo, data: r.tipo === 'adendo' ? hojeStr() : r.data, criadoEm: agoraISO(), campos, cid: r.cid.slice(), refId: r.refId || null, autor: `${s.medico} – ${s.crm}`, assinatura: {status:'pendente'}};

  await salvar();
  S.rascunho = null;
  S.abertos.add(r.refId || salvo.id);
  abrirPaciente(r.patientId);
  aviso(r.editId ? 'Alterações salvas. A versão anterior ficou no histórico.' : 'Registro salvo.' + (pagLancado ? ' Pagamento pendente lançado.' : ''));
}

/* ---------- integridade ---------- */
async function verificarIntegridade(pid) {

  for (const r of registrosDe(pid)) { const ok = (await hashRegistro(r)) === r.hash; S.integridade[r.id] = ok; if (!ok) ruins++; }

const NOTIF_B = ['alprazolam','bromazepam','clobazam','clonazepam','cloxazolam','clordiazepoxido','diazepam','estazolam','flunitrazepam','flurazepam','lorazepam','midazolam','nitrazepam','zolpidem','zopiclona','eszopiclona','fenobarbital'];

function exigeNotificacao(nome) {

const itemVazio = () => ({nome:'', dose:'', forma:'', qtd:'', pos:''});
const FORMAS = ['comprimido','comprimido revestido','comprimido de liberação prolongada','comprimido orodispersível','cápsula','cápsula de liberação prolongada','solução oral (gotas)','solução oral','suspensão oral','xarope','adesivo transdérmico','solução injetável','spray nasal'];
function porExtenso(n) {

  const c = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];

function qtdComExtenso(q) {

  return m ? `${m[1]} (${porExtenso(Number(m[1]))})${m[2] || ''}` : t;
}
const nomeItem = i => i.nome !== undefined ? [i.nome, i.dose].filter(Boolean).join(' ') : (i.med || '');
const normMed = t => semAcento(String(t || '')).toLowerCase().replace(/\(.*?\)/g, ' ').replace(/[^a-z0-9,./ ]/g, ' ').replace(/\s+/g, ' ').trim();
function historicoMeds(p) {
  const lista = [];
  for (const m of p.medicacoes || []) lista.push({nome: m.nome || '', dose: m.dose || '', forma: '', qtd: m.qtd || '', pos: m.posologia || '', data: m.fim || m.inicio || '', origem: m.fim ? 'Já usou (suspensa)' : 'Em uso'});

    if (r.tipo === 'cfm' && r.campos.medicamentos) lista.push(...medsDoCFM(r.campos.medicamentos).map(x => ({...x, data: r.data, origem: 'CFM'})));
  }
  const por = new Map();
  for (const h of lista.sort((a, b) => (b.data || '').localeCompare(a.data || ''))) { const k = normMed(h.nome) + '|' + normMed(h.dose); if (!por.has(k)) por.set(k, {...h, vezes: 1}); else { const e = por.get(k); e.vezes++; for (const c of ['forma', 'qtd', 'pos', 'dose']) if (!e[c] && h[c]) e[c] = h[c]; } }
  return [...por.values()];
}
const RE_QTD = /^(\(?\d+[\d.,]*\)?\s*(\([a-zà-ú\s]+\)\s*)?(caixas?|cx\.?|frascos?|fr\.?|comprimidos?|cps?\.?|cpr\.?|c[aá]psulas?|unidades?|un\.?|ampolas?|bisnagas?|tubos?|envelopes?|sach[eê]s?|blisters?|cartelas?|ml|gotas?)\b|\d+\s*\([a-zà-ú\s]+\)$)/i;

  const out = [];

    const [n, ...rest] = l.replace(/\s*\[uso contínuo\]/i, '').split(/\s+—\s+/);

function ligarReceita() {
  const m = $('#main');
  m.addEventListener('input', e => {
    const el = e.target, r = S.receitaRasc; if (!r) return;
    if (el.dataset.rx) r.itens[Number(el.dataset.i)][el.dataset.rx] = el.value;
    if (el.id === 'rx-or') r.orientacoes = el.value;
    if (el.id === 'rx-data') r.data = el.value;
  });
  m.addEventListener('change', e => {
    const el = e.target, r = S.receitaRasc; if (!r) return;
    if (el.id === 'rx-tipo') { r.tipo = el.value; rerenderReceita(); }
    if (el.id === 'rx-semdata') r.semData = el.checked;
    if (el.dataset.rx === 'nome') rerenderReceita();
    if (el.id === 'rx-modelo' && el.value !== '') {
      const md = MODELOS_RX[Number(el.value)];
      const item = {nome: md.nome, dose: md.dose, forma: md.forma, qtd: md.qtd, pos: md.pos};
      const vazio = r.itens.findIndex(i => !(i.nome || '').trim() && !(i.pos || '').trim());
      if (vazio >= 0) r.itens[vazio] = item; else r.itens.push(item);
      if (md.or && !(r.orientacoes || '').includes(md.or)) r.orientacoes = (r.orientacoes ? r.orientacoes.trim() + '\n\n' : '') + md.or;

  });
}

function escalaRx(dados, cpl, cabe) {
  let n = 0;
  const conta = t => String(t || '').split('\n').reduce((a, l) => a + Math.max(1, Math.ceil(l.length / cpl)), 0);
  for (const i of dados.itens) n += Math.ceil((nomeItem(i).length + (i.forma || '').length + 22) / cpl) + (i.pos ? conta(i.pos) : 0) + 0.6;
  if (dados.orientacoes) n += conta(dados.orientacoes) + 1.2;
  return n <= cabe ? 1 : Math.max(0.66, Math.sqrt(cabe / n));
}

async function gerarReceita(carimbo) {

  const semQtd = itens.filter(i => !i.qtd); if (semQtd.length) return aviso('Informe a quantidade de: ' + semQtd.map(i => i.nome).join(', '));
  if (!itens.length) return aviso('Inclua ao menos um medicamento.');
  if (!r.data) return aviso('Informe a data.');
  const notif = itens.filter(i => exigeNotificacao(i.nome));
  const ok = await confirmar({titulo:'Gerar receita?', texto:`${notif.length ? `<b>Atenção:</b> ${notif.map(i => esc(i.nome)).join(', ')} exige notificação de receita própria (talão da Vigilância). Esta folha não substitui a notificação.<br><br>` : ''}${r.editId ? 'A versão anterior da receita fica guardada no histórico.' : 'A receita fica registrada no prontuário. Enquanto não for assinada digitalmente, você ainda pode editá-la.'}`, ok: r.editId ? 'Salvar e imprimir' : 'Gerar e imprimir'});

  const dados = {tipo: r.tipo, data: r.data, itens, orientacoes: r.orientacoes.trim(), carimbo: !!carimbo, semData: !!r.semData};
  const s = S.dados.settings;
  const reg = {id: uid(), patientId: p.id, tipo: 'receita', data: r.data, criadoEm: agoraISO(),
    campos: {tipoReceita: (r.tipo === 'especial' ? 'Receituário de controle especial' : 'Receita simples') + (r.semData ? ' (impressa sem data)' : ''), itens: itens.map((i, n) => `${n + 1}. ${nomeItem(i)}${i.forma ? ' – ' + i.forma : ''} — ${qtdComExtenso(i.qtd)}${i.pos ? '\n   ' + i.pos : ''}`).join('\n'), ...(dados.orientacoes ? {orientacoes: dados.orientacoes} : {}), dadosReceita: JSON.stringify(dados)},
    cid: [], refId: null, autor: `${s.medico} – ${s.crm}`, assinatura: {status: 'manual'}};
  const salvo = await gravarOuEditar(reg, r.editId); if (!salvo) return;
  auditar(r.editId ? 'Receita editada' : 'Receita gerada', `${reg.campos.tipoReceita} – ${p.nome}`, p.id);
  const mu = atualizarMedsDaReceita(p, itens, r.data);
  await salvar();
  if (mu.novos || mu.atual) setTimeout(() => aviso(`Medicações em uso: ${mu.novos ? mu.novos + ' adicionada(s)' : ''}${mu.novos && mu.atual ? ', ' : ''}${mu.atual ? mu.atual + ' atualizada(s)' : ''}.`, 5000), 1500);
  S.receitaRasc = null; S.abertos.add(salvo.id);
  abrirPaciente(p.id);
  imprimirReceita(dados, p, `${reg.campos.tipoReceita} – ${p.nome}`);
}

const ORIENT_SONO = `Orientações de higiene do sono

Rotina e horário
- Mantenha horários regulares para dormir e acordar, inclusive nos fins de semana.
- Evite cochilos longos durante o dia (se necessário, limite a 20 a 30 minutos e nunca no fim da tarde).
- Crie um ritual de relaxamento antes de dormir: ler, meditar, tomar um banho morno, ouvir música calma.

Ambiente do quarto
- Deixe o quarto escuro, silencioso e fresco.
- Evite luzes fortes e telas (celular, computador, TV) pelo menos 1 hora antes de dormir.
- Use a cama apenas para dormir ou ter intimidade, não para trabalhar, estudar ou comer.
- Invista em um colchão e travesseiro confortáveis.

Alimentação e substâncias
- Evite cafeína, nicotina e álcool nas 4 a 6 horas que antecedem o sono.
- Evite refeições pesadas à noite; opte por algo leve se sentir fome.
- Não vá para a cama com fome, mas também evite exageros.

Hábitos diurnos
- Pratique atividade física regularmente, mas evite exercícios intensos nas 2 a 3 horas antes de dormir.
- Tome sol pela manhã: ajuda a regular o relógio biológico.
- Controle o estresse com técnicas de relaxamento, respiração ou mindfulness.

Durante a noite
- Se não conseguir dormir após 20 a 30 minutos, levante-se e faça algo relaxante (ler um livro, respirar fundo); depois volte à cama.
- Evite olhar o relógio repetidamente: isso aumenta a ansiedade.
- Mantenha um horário fixo para levantar-se, mesmo após uma noite ruim.

Use as medicações exatamente como prescrito e não tome remédios para dormir por conta própria.`;
const ORIENT_FAMILIA = `Orientações à família: segurança e cuidado com as medicações

Guarda das medicações
1. Um familiar responsável deve guardar TODAS as medicações do paciente, em local trancado ou fora do alcance dele.
2. Entregue apenas a dose do dia (ou de cada horário). Se possível, use um organizador semanal preenchido pelo familiar.
3. Confira se as doses foram tomadas e não deixe sobras acumuladas.
4. Retire de casa as medicações antigas, vencidas ou que não estão mais em uso (leve a uma farmácia para descarte).
5. Guarde também as medicações dos outros moradores, venenos, produtos de limpeza fortes e bebidas alcoólicas.
6. Se houver arma de fogo em casa, ela deve ser retirada do domicílio.

Sinais de alerta (procure ajuda imediatamente)
- Falar em morrer, em "sumir", em ser um peso para os outros, ou despedir-se das pessoas.
- Desesperança intensa, isolamento, deixar de comer ou de se cuidar.
- Doar objetos pessoais, organizar documentos ou "deixar tudo resolvido" sem motivo.
- Piora súbita, ou melhora repentina e sem explicação após um período muito difícil.
- Aumento do uso de álcool ou de outras drogas, agitação ou comportamento impulsivo.

Como ajudar
- Ouça sem julgar e sem minimizar o que a pessoa sente.
- Pergunte diretamente se ela está pensando em se machucar ou em tirar a própria vida: perguntar não induz a ideia e ajuda a proteger.
- Em momentos de crise, não deixe a pessoa sozinha.
- Mantenha as consultas e o tratamento em dia e avise o médico sobre qualquer mudança.

Em caso de emergência
- SAMU: 192
- CVV (apoio emocional, 24 horas, gratuito): 188
- Procure a UPA ou o pronto-socorro mais próximo.
- Médico responsável: {medico} – {telefone}`;
const ORIENT_LITIO = `Orientações sobre o uso do lítio

1. Tome o lítio todos os dias, no horário combinado. Não aumente nem diminua a dose por conta própria.
2. Beba bastante água (cerca de 2 litros por dia), principalmente no calor, durante exercícios ou se tiver febre.
3. Não faça dietas com corte de sal sem conversar com o médico.
4. Evite anti-inflamatórios (ibuprofeno, diclofenaco, nimesulida etc.) e diuréticos sem orientação médica: eles aumentam o nível de lítio no sangue.
5. Faça os exames de sangue pedidos. A litemia deve ser colhida cerca de 12 horas após a última dose.
6. Procure atendimento imediatamente se tiver vômitos ou diarreia intensos, tremores fortes, fala enrolada, desequilíbrio, sonolência excessiva ou confusão mental: podem ser sinais de intoxicação.
7. Em caso de gravidez ou suspeita de gravidez, avise o médico.`;
const ORIENT_CLOZAPINA = `Orientações sobre o uso da clozapina

1. O hemograma é obrigatório: semanal nas primeiras 18 semanas e depois mensal. Não deixe de fazer.
2. Procure atendimento no mesmo dia se tiver febre, dor de garganta, feridas na boca ou sinais de infecção, e informe que usa clozapina.
3. Nas primeiras semanas, avise imediatamente se tiver falta de ar, dor no peito, palpitações ou cansaço fora do comum.
4. Prisão de ventre é comum e pode ser grave: beba água, coma fibras e avise se ficar mais de 3 dias sem evacuar ou tiver dor abdominal.
5. Salivação excessiva, sonolência e tontura ao levantar podem acontecer no início: levante devagar.
6. Não interrompa por conta própria. Se ficar 2 dias ou mais sem tomar, fale com o médico antes de recomeçar.
7. Evite álcool. Cigarro altera o nível da clozapina: avise se começar ou parar de fumar.`;
const ORIENT_ESCETAMINA = `Orientações para o tratamento com escetamina (spray nasal)

1. A aplicação é feita no serviço de saúde, sob supervisão. Você ficará em observação até ser liberado (em geral cerca de 2 horas).
2. Não coma nas 2 horas anteriores e não beba líquidos nos 30 minutos anteriores à aplicação.
3. Venha acompanhado. Não dirija nem opere máquinas no dia da aplicação; retome só no dia seguinte, após uma noite de sono.
4. Podem ocorrer, logo após a aplicação, sensação de estranhamento ou dissociação, tontura, náusea, sonolência e aumento da pressão arterial: a equipe vai acompanhar.
5. Evite bebida alcoólica no dia da aplicação.
6. Informe se tiver pressão alta não controlada, doença do coração, aneurisma, AVC prévio, ou se estiver grávida ou amamentando.`;

const ORIENT_DIREITOS_TEA = `Direitos da pessoa com Transtorno do Espectro Autista (TEA)

A pessoa com TEA é considerada pessoa com deficiência para todos os efeitos legais (Lei nº 12.764/2012, Lei Berenice Piana). Isso garante, entre outros, os direitos abaixo.

Identificação e prioridade
- Carteira de Identificação da Pessoa com TEA (CIPTEA), gratuita, emitida pelo estado ou município (Lei nº 13.977/2020, Lei Romeo Mion).
- Atendimento prioritário em serviços públicos e privados, bancos, comércio e filas (Lei nº 10.048/2000 e Lei nº 13.977/2020).

Saúde
- Diagnóstico precoce, atendimento multiprofissional, medicamentos e nutrientes pelo SUS (Lei nº 12.764/2012, art. 3º).
- Planos de saúde: cobertura de psicologia, fonoaudiologia, terapia ocupacional e fisioterapia sem limite de sessões, pelo método indicado pelo médico (Lei nº 14.454/2022 e normas da ANS).

Educação
- Matrícula garantida em escola regular, pública ou particular; a recusa por causa do TEA sujeita o gestor a multa (Lei nº 12.764/2012, art. 7º).
- Acompanhante especializado em sala de aula, quando comprovada a necessidade (Lei nº 12.764/2012, art. 3º, parágrafo único).
- Escolas particulares não podem cobrar valores adicionais pelas adaptações (Lei nº 13.146/2015, art. 28, § 1º).
- Adaptações em provas e atividades, como tempo adicional, quando necessário.

- Benefício de Prestação Continuada (BPC/LOAS): um salário mínimo mensal para famílias de baixa renda (em regra, até 1/4 do salário mínimo por pessoa), após avaliação do INSS (Lei nº 8.742/1993).
- Reserva de vagas para pessoas com deficiência em concursos públicos e em empresas com 100 ou mais empregados (Lei nº 8.213/1991, art. 93).
- Servidores públicos com filho com deficiência podem ter direito a horário especial ou redução de jornada, conforme o regime do servidor.

Transporte e lazer
- Isenção de IPI e, em alguns casos, de IOF na compra de veículo novo (Lei nº 8.989/1995, prorrogada até 31/12/2026); ICMS e IPVA conforme a lei de cada estado.

- Meia-entrada em eventos culturais, esportivos e de lazer para a pessoa com deficiência e, quando necessário, para um acompanhante (Lei nº 12.933/2013).
- Vaga de estacionamento reservada, com a credencial emitida pelo órgão de trânsito do município.

async function montarBackup() {
  const pacote = await cifrar(S.chave, S.dados);
  return {app:'prontuario', formato:1, criadoEm: agoraISO(), salt: S.saltB64, ...pacote};
}
const nomeBackup = () => { const d = new Date(); const p = n => String(n).padStart(2,'0'); return `prontuario-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.prontuario`; };
async function marcarBackup(via) { S.dados.settings.ultimoBackup = {em: agoraISO(), via}; auditar('Backup feito', via); await salvar(); }
async function exportarArquivo() {
  const b = await montarBackup(); const nome = nomeBackup();
  const arq = new File([JSON.stringify(b)], nome, {type:'application/octet-stream'});
  if (ehToque && navigator.canShare && navigator.canShare({files:[arq]})) {
    try { await navigator.share({files:[arq], title:'Backup do prontuário'}); await marcarBackup('arquivo (compartilhado)'); render(); aviso('Backup exportado.'); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  if (emIframe) { aviso('Nesta prévia o download fica bloqueado. Na versão instalada o arquivo é salvo normalmente.', 6000); return; }
  const url = URL.createObjectURL(arq); const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  await marcarBackup('arquivo'); render(); aviso('Backup salvo: ' + nome);
}
async function abrirPacoteBackup(obj) {
  if (!obj || obj.app !== 'prontuario' || !obj.salt || !obj.ct) throw new Error('Este arquivo não é um backup do prontuário.');
  try { return await decifrar(await derivarChave(S.senha, unb64(obj.salt)), obj); }
  catch (e) {
    const s = await pedirSenha('Senha do backup', 'Este backup foi criado com outra senha. Digite a senha usada quando ele foi feito.');
    if (!s) throw new Error('Importação cancelada.');
    try { return await decifrar(await derivarChave(s, unb64(obj.salt)), obj); }
    catch (e2) { throw new Error('Senha incorreta para este backup.'); }
  }
}
function mesclar(inc) {
  const d = S.dados; const cont = {pacientes:0, atualizados:0, registros:0};
  for (const p of inc.patients || []) {
    const i = d.patients.findIndex(x => x.id === p.id);
    if (i < 0) { d.patients.push(p); cont.pacientes++; }
    else if ((p.atualizadoEm || '') > (d.patients[i].atualizadoEm || '')) { d.patients[i] = p; cont.atualizados++; }
  }
  const ids = new Set(d.records.map(r => r.id));
  for (const r of inc.records || []) {
    if (!ids.has(r.id)) { d.records.push(r); cont.registros++; continue; }
    const ex = d.records.find(x => x.id === r.id); if (!ex) continue;
    if (r.pdfAssinado && !ex.pdfAssinado) { Object.assign(ex, r); cont.atualizados++; continue; }
    if (!ex.pdfAssinado && !travado(ex) && (r.editadoEm || '') > (ex.editadoEm || '')) { Object.assign(ex, {data: r.data, campos: r.campos, cid: r.cid, versoes: r.versoes, editadoEm: r.editadoEm, hash: r.hash, assinatura: r.assinatura}); cont.atualizados++; }
  }
  if (inc.pagamentos) { const pg = d.pagamentos = d.pagamentos || []; for (const x of inc.pagamentos) { const i = pg.findIndex(y => y.id === x.id); if (i < 0) pg.push(x); else if ((x.atualizadoEm || '') > (pg[i].atualizadoEm || '')) pg[i] = x; } }
  const aids = new Set(d.audit.map(a => a.id));
  for (const a of inc.audit || []) if (!aids.has(a.id)) d.audit.push(a);
  d.audit.sort((a, b) => a.em.localeCompare(b.em));
  const s = d.settings, si = inc.settings || {};
  for (const k of ['medico','crm','rqe','endereco','telefone','googleClientId']) if (!s[k] && si[k]) s[k] = si[k];
  ajustarQtdMeds();
  return cont;
}
async function importarObjeto(obj, origem) {
  const inc = await abrirPacoteBackup(obj);
  const c = mesclar(inc);
  auditar('Backup importado', `${origem}: +${c.pacientes} paciente(s), +${c.registros} registro(s), ${c.atualizados} atualizado(s)`);
  await salvar(); render();
  aviso(`Importado: ${c.pacientes} paciente(s) novo(s), ${c.registros} registro(s) novo(s), ${c.atualizados} cadastro(s) atualizado(s).`, 6000);
}
async function importarLista(obj, nomeArq) {
  const pats = obj.patients || [], regs = obj.records || [];
  const ok = await confirmar({titulo:'Importar pacientes?', texto:`O arquivo traz <b>${pats.length}</b> paciente(s) e <b>${regs.length}</b> documento(s) de “${esc(obj.origem || 'outra fonte')}”. Pacientes e documentos que já estiverem no app não se repetem, e nada daqui é apagado.`, ok:'Importar'});
  if (!ok) return;
  aviso('Importando…', 20000);
  // Casa com pacientes que já existem no app (mesmo CPF ou mesmo nome), para não duplicar
  const soDig = x => String(x || '').replace(/\D/g, ''), nomeN = x => semAcento(x).replace(/\s+/g, ' ').trim();
  const mapa = {}; let casados = 0; const novos = [];
  for (const ip of pats) {
    if (S.dados.patients.some(x => x.id === ip.id)) { novos.push(ip); continue; }
    const cpf = soDig(ip.cpf);
    const ex = S.dados.patients.find(x => (cpf && soDig(x.cpf) === cpf) || nomeN(x.nome) === nomeN(ip.nome));
    if (ex) {
      mapa[ip.id] = ex.id; casados++;
      for (const k of ['cpf','nascimento','telefone','email','endereco','sexo','mae','cns']) if (!ex[k] && ip[k]) ex[k] = ip[k];
      const ids = new Set((ex.medicacoes || []).map(m => m.id));
      if (!(ex.medicacoes || []).some(m => !m.fim)) for (const m of ip.medicacoes || []) if (!ids.has(m.id)) (ex.medicacoes = ex.medicacoes || []).push(m);
    } else novos.push(ip);
  }
  for (const r of regs) { if (mapa[r.patientId]) r.patientId = mapa[r.patientId]; r.assinatura = r.assinatura || {status:'pendente'}; r.hash = await hashRegistro(r); }
  const c = mesclar({patients: novos, records: regs, audit: []});
  c.casados = casados;
  auditar('Lista de pacientes importada', `${obj.origem || ''} (${nomeArq}): +${c.pacientes} paciente(s), ${c.casados} juntado(s), +${c.registros} registro(s)`);
  await salvar(); S.view = {nome:'inicio'}; render();
  aviso(`Importado: ${c.pacientes} paciente(s) novo(s), ${c.casados} juntado(s) a cadastros que já existiam e ${c.registros} registro(s) novo(s). Agora apague o arquivo de importação.`, 9000);
}
function escolherArquivo() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.prontuario,.json,application/json,application/octet-stream';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try { const obj = JSON.parse(await f.text()); if (obj && obj.app === 'prontuario-importacao') await importarLista(obj, f.name); else await importarObjeto(obj, 'arquivo ' + f.name); }
    catch (e) { aviso(e.message || 'Não foi possível ler o arquivo.', 5000); }
  };
  inp.click();
}

const Drive = {
  token: null, expira: 0, pastaId: null,
  carregarGIS() {
    if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    if (this._carregando) return this._carregando;
    this._carregando = new Promise((res, rej) => {
      const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = () => res(); s.onerror = () => { this._carregando = null; rej(new Error('Não foi possível carregar o login do Google (verifique a internet).')); };
      document.head.appendChild(s);
    });
    return this._carregando;
  },
  async obterToken() {
    if (this.token && Date.now() < this.expira - 60000) return this.token;
    const cid = S.dados.settings.googleClientId;
    if (!cid) throw new Error('Configure primeiro o ID do Google (em Backup › Google Drive).');
    await this.carregarGIS();
    return new Promise((res, rej) => {
      const cliente = google.accounts.oauth2.initTokenClient({
        client_id: cid, scope: 'https://www.googleapis.com/auth/drive.file',
        callback: r => { if (r.error) return rej(new Error('Google: ' + r.error)); this.token = r.access_token; this.expira = Date.now() + (Number(r.expires_in) || 3600) * 1000; res(this.token); },
        error_callback: e => rej(new Error(e && e.type === 'popup_closed' ? 'Login do Google cancelado.' : 'Não foi possível entrar no Google.'))
      });
      cliente.requestAccessToken({prompt: ''});
    });
  },
  async api(url, opts = {}) {
    const t = await this.obterToken();
    const r = await fetch(url, {...opts, headers: {...(opts.headers || {}), Authorization: 'Bearer ' + t}});
    if (r.status === 401) { this.token = null; throw new Error('Sessão do Google expirou. Tente de novo.'); }
    if (!r.ok) throw new Error('Google Drive respondeu com erro ' + r.status + '.');
    return r;
  },
  async pasta() {
    if (this.pastaId) return this.pastaId;
    const q = encodeURIComponent(`name='${NOME_PASTA_DRIVE}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    const j = await (await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`)).json();
    if (j.files && j.files.length) return this.pastaId = j.files[0].id;
    const c = await (await this.api('https://www.googleapis.com/drive/v3/files?fields=id', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name: NOME_PASTA_DRIVE, mimeType:'application/vnd.google-apps.folder'})})).json();
    return this.pastaId = c.id;
  },
  async enviar() {
    const pasta = await this.pasta();
    const b = await montarBackup(), nome = nomeBackup();
    const limite = 'prontuario' + Date.now();
    const corpo = `--${limite}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name: nome, parents: [pasta], mimeType: 'application/octet-stream'})}\r\n--${limite}\r\nContent-Type: application/octet-stream\r\n\r\n${JSON.stringify(b)}\r\n--${limite}--`;
    await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name', {method:'POST', headers:{'Content-Type': 'multipart/related; boundary=' + limite}, body: corpo});
    return nome;
  },
  async maisRecente() {
    const pasta = await this.pasta();
    const q = encodeURIComponent(`'${pasta}' in parents and trashed=false`);
    const j = await (await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=createdTime desc&pageSize=1&fields=files(id,name,createdTime)`)).json();
    return (j.files || [])[0] || null;
  },
  async baixar(id) { return (await this.api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json(); }
};
async function driveSalvar(btn) {
  btn && (btn.disabled = true);
  try { const nome = await Drive.enviar(); await marcarBackup('Google Drive'); render(); aviso('Backup enviado ao Google Drive: ' + nome, 5000); }

function pdfLME(d, p) {

    while (z > 5.5 && largPdf(codigos1252(t), 'R', z) > larg) z -= .25;
    if (largPdf(codigos1252(t), 'R', z) > larg) avisos.push('texto cortado: ' + t.slice(0, 30));
    const w = largPdf(codigos1252(t), 'R', z), x = centro ? x0 + (x1 - x0 - w) / 2 : x0 + 4.5;
    escreve(t, x, y0 + (y1 - y0 - z) / 2 + z * .2, z);
  };
  const bloco = (r, t, tam, rotulo) => {
    t = String(t || '').trim(); if (!t) return;
    const [x0, y0, x1, y1] = r, larg = x1 - x0 - 6, alt = y1 - y0 - 2; let z = tam, ls;
    for (; z >= 5.5; z -= .25) { ls = quebrarPdf(t.replace(/\n{2,}/g, '\n'), 'R', z, larg); if (ls.length * z * 1.15 <= alt) break; }
    if (z < 5.5) { z = 5.5; ls = quebrarPdf(t.replace(/\n{2,}/g, '\n'), 'R', z, larg); const cabe = Math.floor(alt / (z * 1.15)); if (ls.length > cabe) { ls = ls.slice(0, cabe); ls[cabe - 1] = ls[cabe - 1].replace(/\s*\S*$/, '') + ' (…)'; avisos.push(rotulo); } }
    let y = y1 - 1 - z;
    for (const l of ls) { if (l) escreve(l, x0 + 3, y, z); y -= z * 1.15; }
  };
  const marca = r => { if (!r) return; const [x0, y0, x1, y1] = r, z = 8.5; escreve('X', x0 + (x1 - x0 - largPdf([88], 'B', z)) / 2, y0 + (y1 - y0 - z) / 2 + z * .17, z, 'B'); };

  d.meds.slice(0, 6).forEach((m, i) => { const [y0, y1] = L.linhas[i]; linha([L.medX[0], y0, L.medX[1], y1], m.nome); m.q.forEach((q, j) => linha([L.qX[j][0], y0, L.qX[j][1], y1], q, 9, true)); });
  linha(L.cid, d.cid, 9.5, true); linha(L.diag, d.diag); bloco(L.anamnese, d.anamnese, 9, 'anamnese (campo 11)');
  if (d.trat === 'nao') marca(L.tratNao); if (d.trat === 'sim') { marca(L.tratSim); bloco(L.trat, d.tratTxt, 8.5, 'tratamento prévio (campo 12)'); }
  if (d.incapaz === 'sim') { marca(L.incSim); linha(L.resp, d.resp); } else marca(L.incNao);
  linha(L.medico, `${s.medico || ''} – ${s.crm || ''}`); linha(L.cns, d.cnsMedico); linha(L.data, d.data ? fmtData(d.data) : '', 9.5, true);
  if (!b) {

    if (L.raca[d.raca]) marca(L.raca[d.raca]); if (d.raca === 'Indígena') linha(L.etnia, d.etnia);
    const tels = String(d.tel || '').split(/\s*[\/;,]\s*/).filter(Boolean); linha(L.tel1, tels[0]); linha(L.tel2, tels.slice(1).join(' / '));
    if (d.docNum) { marca(d.docTipo === 'CNS' ? L.docCns : L.docCpf); linha(L.doc, d.docNum); }

  const objs = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    `<< /Type /Pages /Kids [3 0 R] /Count 1 >>`,
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> /XObject << /Im1 7 0 R >> >> /Contents 4 0 R >>`,
    `<< /Length ${conteudo.length} >>\nstream\n${conteudo}\nendstream`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
    `<< /Type /XObject /Subtype /Image /Width 1654 /Height 2339 /ColorSpace [/Indexed /DeviceRGB 15 <${LME_PAL}>] /BitsPerComponent 4 /Filter /FlateDecode /DecodeParms << /Predictor 15 /Colors 1 /BitsPerComponent 4 /Columns 1654 >> /Length ${img.length} >>\nstream\n${img}\nendstream`,
    `<< /Title (LME) /Author (${String(s.medico || '').replace(/[()\\]/g, '')}) /Producer (Prontuario ${APP_VERSAO}) >>`];
  let pdf = '%PDF-1.4\n%âãÏÓ\n'; const offs = [];

}
function dadosReciboTexto(x) {

/* ---------- busca no prontuário inteiro ---------- */
function telaBuscaGeral() {
  S.buscaG = S.buscaG || {q: '', f: ''};

    <div class="apoio-topo" style="display:flex;flex-wrap:wrap;gap:.35rem;padding-bottom:.9rem">${chip('Usa lítio', 'lítio')}${chip('Usa clozapina', 'clozapina')}${chip('Usa valproato', 'valpro')}${chip('CID F31', 'F31')}${chip('CID F32/F33', 'F3')}${chip('LMEs a renovar', '', 'lme')}${chip('Retornos atrasados', '', 'ret')}${chip('Pagamentos pendentes', '', 'pag')}</div></div>

function ligarBuscaGeral() {
  const i = $('#bg-q'); if (!i) return;
  i.addEventListener('input', () => { S.buscaG.q = i.value; S.buscaG.f = ''; $('#bg-res').innerHTML = resultadosBusca(); document.querySelectorAll('[data-act=bg-chip]').forEach(b => b.classList.toggle('on', !b.dataset.f && b.dataset.q === i.value)); });
  if (!ehToque) i.focus();
}
function trecho(txt, qn) {
  const t = String(txt), i = semAcento(t).indexOf(qn); if (i < 0) return esc(t.slice(0, 120));
  const a = Math.max(0, i - 60), b = Math.min(t.length, i + qn.length + 80);
  return (a ? '…' : '') + esc(t.slice(a, i)) + '<mark>' + esc(t.slice(i, i + qn.length)) + '</mark>' + esc(t.slice(i + qn.length, b)) + (b < t.length ? '…' : '');
}
function resultadosBusca() {
  const B = S.buscaG || {q: '', f: ''};
  if (B.f === 'lme') return painelLMEs() || '<div class="card vazio">Nenhuma LME vencendo nos próximos 20 dias.</div>';
  if (B.f === 'ret') { const {atras} = listaRetornos(); return atras.length ? `<div class="card"><h2>Retornos atrasados (${atras.length})</h2>${atras.map(x => itemRetorno(x, true)).join('')}</div>` : '<div class="card vazio">Nenhum retorno atrasado.</div>'; }
  if (B.f === 'pag') { const pend = pags().filter(x => !x.excluido && x.status === 'pendente' && paciente(x.patientId)).sort((a, b) => a.data.localeCompare(b.data)); return pend.length ? `<div class="card"><h2>Pagamentos pendentes (${pend.length}) · ${fmtReal(pend.reduce((a, x) => a + x.valor, 0))}</h2>${pend.map(x => linhaPag(x, true)).join('')}</div>` : '<div class="card vazio">Nenhum pagamento pendente.</div>'; }
  const q = (B.q || '').trim(), qn = semAcento(q);
  if (qn.length < 2) return '<p style="color:var(--suave)">Digite ao menos 2 letras. A busca olha medicações, CIDs, todos os registros e os cadastros.</p>';
  const ativos = S.dados.patients.filter(p => !p.arquivado);
  const emUso = [], usou = [];
  for (const p of ativos) for (const m of p.medicacoes || []) if (semAcento(m.nome).includes(qn)) (m.fim ? usou : emUso).push({p, m});
  const ehCid = /^[a-z]\d{0,2}(\.\d)?$/i.test(q);
  const porCid = new Map();
  if (ehCid) for (const r of S.dados.records) { if (anulado(r) || !paciente(r.patientId)) continue; for (const c of r.cid || []) if (c.toUpperCase().replace(/\s/g, '').startsWith(q.toUpperCase())) { const e = porCid.get(r.patientId); if (!e || r.data > e.data) porCid.set(r.patientId, {data: r.data, cid: c}); } }
  const pacs = ativos.filter(p => semAcento(p.nome).includes(qn) || (qn.replace(/\D/g, '').length >= 4 && (p.cpf || '').replace(/\D/g, '').includes(qn.replace(/\D/g, ''))));
  const regs = [];
  for (const r of S.dados.records) {
    if (anulado(r) || r.tipo === 'anulacao' || !paciente(r.patientId)) continue;
    const txt = Object.entries(r.campos || {}).filter(([k]) => !/^dados/.test(k)).map(([, v]) => v).join('\n') + '\n' + (r.cid || []).join('; ');
    if (semAcento(txt).includes(qn)) regs.push({r, txt});
  }
  regs.sort((a, b) => (b.r.data + b.r.criadoEm).localeCompare(a.r.data + a.r.criadoEm));
  const pac = id => paciente(id);
  const bloco = (tit, itens) => itens ? `<div class="card"><h2>${tit}</h2>${itens}</div>` : '';
  let h = '';
  h += bloco(`Em uso de “${esc(q)}” (${emUso.length})`, emUso.sort((a, b) => a.p.nome.localeCompare(b.p.nome, 'pt-BR')).map(x => `<div class="ret-item"><button class="btn link" style="padding:0;min-height:0;font-weight:600" data-act="abrir-paciente" data-id="${x.p.id}">${esc(x.p.nome)}</button><small style="color:var(--suave);text-align:right">${esc(x.m.nome)} ${esc(x.m.dose || '')}${x.m.inicio ? ' · desde ' + fmtData(x.m.inicio) : ''}</small></div>`).join(''));
  h += bloco(`Já usaram (${usou.length})`, usou.map(x => `<div class="ret-item"><button class="btn link" style="padding:0;min-height:0" data-act="abrir-paciente" data-id="${x.p.id}">${esc(x.p.nome)}</button><small style="color:var(--suave);text-align:right">${esc(x.m.nome)} ${esc(x.m.dose || '')} · até ${fmtData(x.m.fim)}${x.m.motivo ? ' · ' + esc(x.m.motivo) : ''}</small></div>`).join(''));
  h += bloco(`Com CID ${esc(q.toUpperCase())} (${porCid.size})`, [...porCid.entries()].sort((a, b) => pac(a[0]).nome.localeCompare(pac(b[0]).nome, 'pt-BR')).map(([pid, x]) => `<div class="ret-item"><button class="btn link" style="padding:0;min-height:0;font-weight:600" data-act="abrir-paciente" data-id="${pid}">${esc(pac(pid).nome)}</button><small style="color:var(--suave);text-align:right">${esc(x.cid)} · ${fmtData(x.data)}</small></div>`).join(''));
  h += bloco(`Pacientes (${pacs.length})`, pacs.map(p => `<div class="ret-item"><button class="btn link" style="padding:0;min-height:0;font-weight:600" data-act="abrir-paciente" data-id="${p.id}">${esc(p.nome)}</button><small style="color:var(--suave)">${p.nascimento ? esc(idade(p.nascimento)) : ''}</small></div>`).join(''));
  h += bloco(`Nos registros (${regs.length}${regs.length > 60 ? ', mostrando 60' : ''})`, regs.slice(0, 60).map(x => `<div class="ret-item" style="display:block"><button class="btn link" style="padding:0;min-height:0;font-weight:600" data-act="bg-abrir" data-pid="${x.r.patientId}" data-r="${x.r.id}">${esc(pac(x.r.patientId).nome)}</button> <small style="color:var(--suave)">· ${esc(nomeTipo(x.r.tipo))} · ${fmtData(x.r.data)}</small><div class="bg-trecho">${trecho(x.txt, qn)}</div></div>`).join(''));
  return h || `<div class="card vazio">Nada encontrado para “${esc(q)}”.</div>`;
}

/* ---------- resumo do paciente (1 página) ---------- */
function htmlResumo(p) {
  const regs = registrosDe(p.id).filter(r => !anulado(r));
  const ord = regs.slice().sort((a, b) => (b.data + (b.criadoEm || '')).localeCompare(a.data + (a.criadoEm || '')));
  const ats = ord.filter(r => ['primeira', 'evolucao', 'doctoralia'].includes(r.tipo));

  const corta = (t, n) => { t = String(t || '').trim(); return t.length > n ? t.slice(0, n).replace(/\s+\S*$/, '') + '…' : t; };
  const cids = new Map(); for (const r of ord) for (const c of r.cid || []) { const k = c.split(/\s|–/)[0].toUpperCase(); if (!cids.has(k)) cids.set(k, {c, data: r.data}); }
  const ativas = (p.medicacoes || []).filter(m => !m.fim), susp = (p.medicacoes || []).filter(m => m.fim).sort((a, b) => b.fim.localeCompare(a.fim));
  const risco = ord.find(r => ['primeira', 'evolucao'].includes(r.tipo) && (r.campos.ris_ideacao || r.campos.ris_nivel || r.campos.risco));
  const ultCond = ord.find(r => ['primeira', 'evolucao'].includes(r.tipo) && r.campos.conduta);
  const ret = retornoPrevisto(p.id);
  const escs = {}; for (const r of regs.filter(r => r.tipo === 'escala').sort((a, b) => a.data.localeCompare(b.data))) { const d = dadosEscalaReg(r); if (d && ESCALAS[d.chave]) (escs[d.chave] = escs[d.chave] || []).push({r, d}); }
  const lit = ord.find(r => r.tipo === 'litemia');
  const mon = k => ultimoMon(p.id, k);
  const lme = ord.find(r => r.tipo === 'lme');
  const sec = (t, h) => h ? `<div class="res-sec"><h4>${t}</h4>${h}</div>` : '';
  const li = arr => arr.filter(Boolean).length ? `<ul>${arr.filter(Boolean).map(x => `<li>${x}</li>`).join('')}</ul>` : '';
  const antes = prim ? [['tentativas', 'Tentativas/autolesão'], ['internacoes', 'Internações'], ['ant_psiq', 'Antecedentes psiquiátricos'], ['ant_clinicos', 'Clínicos'], ['substancias', 'Substâncias'], ['familiar', 'Família']].filter(([k]) => (prim.campos[k] || '').trim()).map(([k, rot]) => `<b>${rot}:</b> ${esc(corta(prim.campos[k], 220))}`) : [];
  const monTxt = [mon('peso') && `Peso ${fmtNum(mon('peso').y)} kg${mon('imc') ? ' · IMC ' + fmtNum(mon('imc').y) : ''} (${fmtData(mon('peso').x)})`,
    (() => { const s = regsMon(p.id).filter(r => r.campos.pa); const r = s[s.length - 1]; return r ? `PA ${esc(r.campos.pa)} (${fmtData(r.data)})` : ''; })(),
    mon('glicemia') && `Glicemia ${fmtNum(mon('glicemia').y, 0)} (${fmtData(mon('glicemia').x)})`, mon('hba1c') && `HbA1c ${fmtNum(mon('hba1c').y)}% (${fmtData(mon('hba1c').x)})`,
    mon('ldl') && `LDL ${fmtNum(mon('ldl').y, 0)} (${fmtData(mon('ldl').x)})`, mon('tg') && `TG ${fmtNum(mon('tg').y, 0)} (${fmtData(mon('tg').x)})`,
    mon('neutro') && `Neutrófilos ${fmtNum(mon('neutro').y, 0)} (${fmtData(mon('neutro').x)})`, mon('valp') && `Valproato ${fmtNum(mon('valp').y)} µg/mL (${fmtData(mon('valp').x)})`,
    lit && `Litemia ${esc(lit.campos.valor)} mEq/L (${fmtData(lit.data)})`].filter(Boolean);
  return `<div class="p-doc resumo">${cabecalhoImpressao()}

    <div class="res-id"><b style="font-size:12pt">${esc(p.nome)}</b>${p.nomeSocial ? ` (nome social: ${esc(p.nomeSocial)})` : ''}<br>
      ${[p.nascimento && `Nasc. ${fmtData(p.nascimento)} (${esc(idade(p.nascimento))})`, p.sexo && esc(p.sexo), p.cpf && 'CPF ' + esc(p.cpf), p.cns && 'CNS ' + esc(p.cns), p.telefone && esc(p.telefone), p.tipoAtend && esc(p.tipoAtend + (p.convenio ? ' · ' + p.convenio : ''))].filter(Boolean).join(' · ')}

      ${sec('Diagnósticos (CID-10)', li([...cids.values()].slice(0, 6).map(x => `${esc(x.c)} <span class="res-d">${fmtData(x.data)}</span>`)))}
      ${sec('Medicações em uso', ativas.length ? li(ativas.map(m => `<b>${esc(m.nome)}</b> ${esc(m.dose || '')}${m.posologia ? ' – ' + esc(m.posologia) : ''}${m.inicio ? ` <span class="res-d">desde ${fmtData(m.inicio)}</span>` : ''}`)) : '<p>Nenhuma.</p>')}
      ${sec('Já usou', li(susp.slice(0, 8).map(m => `${esc(m.nome)} ${esc(m.dose || '')} <span class="res-d">${m.inicio ? fmtData(m.inicio) : '?'}–${fmtData(m.fim)}${m.motivo ? ' · ' + esc(corta(m.motivo, 60)) : ''}</span>`).concat(prim && prim.campos.med_previas ? [esc(corta(prim.campos.med_previas, 260))] : [])))}

      ${sec('Antecedentes', li(antes))}
      ${sec('Escalas', li(Object.entries(escs).map(([k, l]) => { const u = l[l.length - 1], pr = l[0]; return `<b>${esc(ESCALAS[k].sigla)}</b> ${u.d.total} – ${esc(calcularEscala(k, u.d.resp).interp)} <span class="res-d">${fmtData(u.r.data)}${l.length > 1 ? ` · 1ª: ${pr.d.total} em ${fmtData(pr.r.data)}` : ''}</span>`; })))}
      ${sec('Exames e medidas', li(monTxt))}
