  'rx-repetir': d => { const r = S.receitaRasc, reg = S.dados.records.find(x => x.id === d.id); let dd; try { dd = JSON.parse(reg.campos.dadosReceita); } catch (e) { return; } r.itens = dd.itens.map(i => ({...i})); r.tipo = dd.tipo; r.orientacoes = dd.orientacoes || ''; rerenderReceita(); aviso('Itens da receita anterior carregados. Ajuste o que precisar.'); },
  'imprimir-registro': d => { const r = S.dados.records.find(x => x.id === d.id); imprimir(docImpressao(r), nomeTipo(r.tipo) + ' – ' + paciente(r.patientId).nome, r.patientId); },
  'imprimir-paciente': d => { const regs = registrosDe(d.id).filter(r => !TIPOS_AUX.includes(r.tipo) && !anulado(r)).sort((a, b) => a.data.localeCompare(b.data)); if (!regs.length) return aviso('Não há registros para imprimir.'); imprimir(regs.map(docImpressao).join(''), 'Prontuário completo – ' + paciente(d.id).nome, d.id); },
  'exportar': () => exportarArquivo().catch(e => aviso(e.message)),
  'importar': () => escolherArquivo(),
  'drive-config': () => configurarDrive(),
  'drive-salvar': (d, el) => driveSalvar(el),
  'drive-puxar': (d, el) => drivePuxar(el),
  'trocar-senha': () => trocarSenha(),
  'demo': () => carregarDemo(),
  'apagar-tudo': () => apagarTudo(),
  'novo-monitor': d => abrirMonitor(d.pid),
  'mon-salvar': () => salvarMonitor(),
  'doc-protocolo': d => { abrirDocumento(d.pid); escolherModeloDoc(d.k); },
  'doc-modelo-p': d => { abrirDocumento(d.pid); escolherModeloDoc(d.k); },
  'linha-tempo': d => { S.view = {nome: 'linha', pid: d.id}; render(); },
  'linha-periodo': d => { S.linhaPer = d.k; render(); },
  'resumo-paciente': d => mostrarResumo(d.id),
  'ret-dispensar': async d => { const p = paciente(d.pid); if (!await confirmar({titulo: 'Dispensar este retorno?', texto: `${esc(p.nome)} sai da lista de retornos até a próxima consulta registrada.`, ok: 'Dispensar'})) return; p.retornoDispensado = d.r; p.atualizadoEm = agoraISO(); auditar('Retorno dispensado', p.nome, p.id); await salvar(); render(); },
  'lme-dispensar': async d => { const p = paciente(d.pid); if (!await confirmar({titulo: 'Não renovar esta LME?', texto: `${esc(p.nome)} sai da lista até a próxima LME registrada.`, ok: 'Confirmar'})) return; p.lmeDispensada = d.r; p.atualizadoEm = agoraISO(); auditar('LME não renovada', p.nome, p.id); await salvar(); render(); },
  'pag-novo': d => modalPagamento(d.pid),
  'pag-editar': d => modalPagamento(d.pid, d.id),
  'pag-pago': async d => { const x = pags().find(y => y.id === d.id); x.status = 'pago'; x.atualizadoEm = agoraISO(); auditar('Pagamento recebido', `${paciente(x.patientId).nome}: ${fmtReal(x.valor)}`, x.patientId); await salvar(); render(); aviso('Marcado como recebido. Lembre de emitir o recibo no Receita Saúde.', 5000); },
  'pag-recibo': async d => { const x = pags().find(y => y.id === d.id); x.recibo = true; x.atualizadoEm = agoraISO(); auditar('Recibo Receita Saúde emitido', `${paciente(x.patientId).nome}: ${fmtReal(x.valor)}`, x.patientId); await salvar(); render(); },
  'pag-copiar': d => copiarRecibo(d.id),
  'bg-chip': d => { S.buscaG = {q: d.q || '', f: d.f || ''}; render(); },
  'bg-abrir': d => { S.abertos.add(d.r); abrirPaciente(d.pid); setTimeout(() => { const el = document.querySelector(`[data-reg="${d.r}"]`) || document.getElementById('reg-' + d.r); if (el) el.scrollIntoView({block: 'center'}); }, 50); }
};
Object.assign(ACOES, ACOES_GV);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || !S.chave) return;
  const f = ACOES[el.dataset.act]; if (!f) return;
  if (el.tagName === 'A') e.preventDefault();
  f(el.dataset, el, e);
});
document.addEventListener('submit', e => {
  if (!S.chave) return;
  if (e.target.id === 'f-paciente') { e.preventDefault(); salvarPaciente(e.target); }
  if (e.target.id === 'f-config') {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target).entries());
    Object.assign(S.dados.settings, fd, {bloqueioMin: Math.max(1, Number(fd.bloqueioMin) || 10)});
    auditar('Ajustes alterados'); salvar().then(() => { render(); aviso('Ajustes salvos.'); });
  }
});

/* ---------- início do app ---------- */
if ('serviceWorker' in navigator && !emIframe && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (!window.crypto || !crypto.subtle) {
  document.getElementById('app').innerHTML = '<div class="lock"><div class="card"><h1>Prontuário</h1><p>Este navegador não oferece a criptografia necessária. Abra pelo endereço seguro (https) do app.</p></div></div>';
} else {
  telaBloqueio();
}

</script>
</body>
</html>
